name: Keep Supabase awake

# Second keep-alive for the Supabase project behind /repo (M2proj has its own); GitHub disables
# scheduled jobs in repos without commits for 60 days, so two repos make a silent stop much less likely.
on:
  schedule:
    - cron: '0 18 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call public.ping()
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ vars.PUBLIC_SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
